<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Age Calculator</title>
</head>
<body>
    <!-- <input type="date"> -->
    <div class="page">
        <div class="date">
            <p class="txt-sm day">DAY</p>
            <p class="txt-sm mon">MONTH</p>
            <p class="txt-sm yr">YEAR</p>

            <input id="day" class="input-date" type="text" placeholder="DD" min="1" max="31" minlength="1" maxlength="2">

            <input id="month" class="input-date" type="text" placeholder="MM" min="1" max="12" minlength="1" maxlength="2">

            <input id="year" class="input-date" type="text" placeholder="YYYY" min="1" max="9999" minlength="1" maxlength="4" inputmode="numeric">

        </div>
        
        <div class="separator">
            <button class="click-arrow">
                <img src="/svg/icon-arrow.svg">
            </button>
        </div>

        <div class="result">
            <div class="date-res"> <span id="age-year" class="date-num">--</span>  <h2 class="date-txt">years</h2> </div>
            <div class="date-res"> <span id="age-month" class="date-num">--</span>  <h2 class="date-txt">months</h2>  </div>
            <div class="date-res"> <span id="age-days" class="date-num">--</span>  <h2 class="date-txt">days</h2>  </div>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
